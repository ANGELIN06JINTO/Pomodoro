<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Caveat&display=swap');

    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(270deg, 
            #ffb3ba, #ffdfba, #ffffba, #ffb3f3, #ffd6a5);
        background-size: 1400% 1400%;
        animation: flowingWater 20s ease infinite;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #fff;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        overflow-x: hidden;
    }

    @keyframes flowingWater {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    h1 {
        font-family: 'Pacifico', cursive;
        font-size: 2.5em;
        margin: 15px;
        text-align: center;
        color: #fff8e7;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }

    #timer {
        font-size: 4em;
        margin-bottom: 20px;
        padding: 20px 40px;
        border-radius: 25px;
        background: rgba(255,255,255,0.25);
        backdrop-filter: blur(10px);
        box-shadow: 0 6px 25px rgba(255, 182, 193, 0.3);
        text-align: center;
        width: fit-content;
        min-width: 220px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 10px;
        text-align: center;
    }

    button {
        background-color: #ffd6e0;
        color: #d63384;
        border: none;
        padding: 12px 30px;
        font-size: 1.2em;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 15px rgba(255, 182, 193, 0.4);
        font-family: 'Caveat', cursive;
        flex: 1 1 130px;
        max-width: 180px;
    }

    button:hover {
        background-color: #fff0f5;
        transform: scale(1.08);
        box-shadow: 0 8px 22px rgba(255, 192, 203, 0.5);
    }

    button:active {
        transform: scale(0.97);
        box-shadow: 0 4px 12px rgba(255, 192, 203, 0.4);
    }

    #focus-warning {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        color: #fff;
        font-size: 2em;
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: 9999;
        padding: 20px;
        backdrop-filter: blur(5px);
    }

    #focus-status {
        font-size: 1.2em;
        margin-top: 10px;
        color: #fff8e7;
        font-family: 'Caveat', cursive;
        text-align: center;
    }

    #alarm-controls {
        display: none;
        margin-top: 15px;
        text-align: center;
        width: 100%;
    }

    #alarm-controls button {
        max-width: 220px;
    }

    .mode-btn.active {
        background-color: #ffb3c6;
        color: #fff;
    }

    /* 📱 Responsive fixes for mobile screens */
    @media (max-height: 700px) {
        body {
            height: auto;
            padding: 20px;
        }
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 2em;
        }

        #timer {
            font-size: 3em;
            padding: 15px 25px;
        }

        button {
            font-size: 1em;
            padding: 10px 20px;
        }

        #alarm-controls {
            margin-top: 25px;
        }
    }

    @media (max-width: 400px) {
        #timer {
            font-size: 2.5em;
        }

        button {
            font-size: 0.9em;
            padding: 8px 16px;
            max-width: 150px;
        }

        h1 {
            font-size: 1.8em;
        }
    }
</style>

</head>
<body>
    <h1>🌈 Pomodoro Focus Timer 🌈</h1>
    <div id="timer">25:00</div>

    <div class="controls">
        <button class="mode-btn active" onclick="setMode('pomodoro')">Pomodoro</button>
        <button class="mode-btn" onclick="setMode('short')">Short Break</button>
        <button class="mode-btn" onclick="setMode('long')">Long Break</button>
    </div>

    <div class="controls">
        <button onclick="startTimer()">Start Timer</button>
        <button onclick="toggleFocusMode()">Focus Mode: OFF</button>
    </div>

    <div id="focus-status"></div>

    <div id="alarm-controls">
        <button onclick="stopAlarm()">🛑 Stop Alarm</button>
    </div>

    <!-- gentle alarm sound -->
    <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" loop></audio>

    <script>
        let timer;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isVisible = true;
        let focusMode = false;
        let currentMode = "pomodoro"; // modes: pomodoro, short, long

        const focusButton = document.querySelectorAll("button")[4];
        const alarm = document.getElementById("alarmSound");
        const alarmControls = document.getElementById("alarm-controls");
        const timerDisplay = document.getElementById("timer");

        const modes = {
            pomodoro: 25 * 60,
            short: 5 * 60,
            long: 15 * 60
        };

        function setMode(mode) {
            clearInterval(timer);
            isRunning = false;
            currentMode = mode;
            totalTime = modes[mode];
            updateDisplay();
            highlightActiveButton(mode);
            stopAlarm();
        }

        function highlightActiveButton(mode) {
            document.querySelectorAll(".mode-btn").forEach(btn => {
                btn.classList.remove("active");
            });
            document.querySelector(`[onclick="setMode('${mode}')"]`).classList.add("active");
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timer = setInterval(countdown, 1000);
        }

        function countdown() {
            if (!isVisible) return;

            let minutes = Math.floor(totalTime / 60);
            let seconds = totalTime % 60;

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerDisplay.textContent = `${minutes}:${seconds}`;
            totalTime--;

            if (totalTime < 0) {
                clearInterval(timer);
                triggerAlarm();
            }
        }

        function triggerAlarm() {
            timerDisplay.textContent = "00:00";
            alarm.play();
            alarmControls.style.display = "block";

            let msg = "";
            if (currentMode === "pomodoro") msg = "🎉 Time’s up! Take a short break 🌿";
            else if (currentMode === "short") msg = "💪 Short break over! Ready for another focus session?";
            else msg = "🌅 Long break finished! Time to get back on track!";

            alert(msg);
        }

        function stopAlarm() {
            alarm.pause();
            alarm.currentTime = 0;
            alarmControls.style.display = "none";
        }

        function updateDisplay() {
            let minutes = Math.floor(totalTime / 60);
            let seconds = totalTime % 60;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            timerDisplay.textContent = `${minutes}:${seconds}`;
        }

        function toggleFocusMode() {
            focusMode = !focusMode;
            focusButton.textContent = `Focus Mode: ${focusMode ? "ON" : "OFF"}`;
            focusButton.style.backgroundColor = focusMode ? "#ff9eb5" : "#ffd6e0";
            document.getElementById("focus-status").textContent = focusMode 
                ? "🧘 Focus mode activated — stay in this tab!"
                : "💤 Focus mode turned off. You can switch freely now.";
        }

        document.addEventListener("visibilitychange", () => {
            if (focusMode && document.hidden && isRunning) {
                isVisible = false;
                document.getElementById("focus-warning").style.display = "flex";
            } else {
                isVisible = true;
                if (document.getElementById("focus-warning"))
                    document.getElementById("focus-warning").style.display = "none";
            }
        });

        window.addEventListener("beforeunload", (e) => {
            if (focusMode && isRunning && totalTime > 0) {
                e.preventDefault();
                e.returnValue = "You are in focus mode! Are you sure you want to leave?";
                return e.returnValue;
            }
        });

        updateDisplay();
    </script>
</body>
</html>
